<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6EE;
    --card: #FFFDF9;
    --ink: #2B211C;
    --ink-2: #6B5B52;
    --line: #E7DCCD;
    --wine: #8E2C3A;
    --wine-ink: #FFFFFF;
    --wine-soft: #F5E4E2;
    --amber: #A65A0C;
    --amber-soft: #F8EAD7;
    --ok: #2F6B4F;
    --cover-1: #9B3443;
    --cover-2: #6E1F2C;
    --cover-ink: #FBF1E4;
    --shadow: 0 1px 2px rgba(43, 33, 28, .06), 0 8px 24px rgba(43, 33, 28, .07);
    --radius: 18px;
    --display: 'Cormorant Garamond', Georgia, serif;
    --serif: 'Libre Baskerville', Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --nav-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191412; --card: #231C19; --ink: #F2E8DD; --ink-2: #B8A799; --line: #3A2F29;
      --wine: #E58A93; --wine-ink: #2A0F14; --wine-soft: #3A2226; --amber: #E7A75E; --amber-soft: #3A2C1D;
      --ok: #7CC3A0; --cover-1: #7A2633; --cover-2: #4A1520;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #191412; --card: #231C19; --ink: #F2E8DD; --ink-2: #B8A799; --line: #3A2F29;
    --wine: #E58A93; --wine-ink: #2A0F14; --wine-soft: #3A2226; --amber: #E7A75E; --amber-soft: #3A2C1D;
    --ok: #7CC3A0; --cover-1: #7A2633; --cover-2: #4A1520;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15.5px/1.65 var(--serif);
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
    overflow-x: hidden;
  }
  a { color: var(--wine); }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: .005em; font-variant-numeric: lining-nums; }
  .num, .pasos li::before, ol.preguntas li::marker { font-variant-numeric: lining-nums; }
  h1 { font-size: 2.3rem; }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.25rem; }
  p { margin: 0; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Encabezado */
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    max-width: 680px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .marca { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font: 600 1.25rem/1 var(--display); min-height: 44px; }
  .marca .ic { color: var(--wine); width: 22px; height: 22px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    border: 0; background: transparent; color: var(--ink-2); cursor: pointer; text-decoration: none;
    transition: background-color .2s, color .2s;
  }
  .icon-btn:hover { background: var(--wine-soft); color: var(--wine); }

  main { max-width: 680px; margin: 0 auto; padding: 4px 16px 0; outline: none; }
  .vista { display: grid; gap: 16px; animation: entrar .28s ease-out; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Tarjetas */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .card > * + * { margin-top: 12px; }
  .eyebrow { font: 600 .74rem/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--wine); }
  .meta { font: 400 .85rem/1.4 var(--sans); color: var(--ink-2); }
  .suave { color: var(--ink-2); }
  .titulo-vista { padding: 8px 2px 0; }
  .titulo-vista p { margin-top: 6px; color: var(--ink-2); }

  /* Portada */
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 8px 2px 4px; }
  .portada {
    width: 96px; aspect-ratio: 2 / 3; border-radius: 4px 10px 10px 4px; position: relative;
    background: linear-gradient(160deg, var(--cover-1), var(--cover-2));
    color: var(--cover-ink); display: flex; flex-direction: column; justify-content: space-between; padding: 12px 10px 10px 14px;
    box-shadow: inset 4px 0 0 rgba(0, 0, 0, .18), 0 10px 24px rgba(110, 31, 44, .28);
  }
  .portada .pa { font: 500 .62rem/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .portada .pt { font: 600 1.3rem/1 var(--display); }
  .portada .ic { width: 16px; height: 16px; stroke: none; fill: #F2B36B; }
  .hero h1 { font-size: clamp(2rem, 8vw, 2.6rem); }
  .hero .meta { margin-top: 6px; }

  /* Botones */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    font: 600 .95rem/1.2 var(--sans); text-decoration: none;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    transition: background-color .2s, border-color .2s, transform .15s;
  }
  .btn:hover { border-color: var(--wine); color: var(--wine); }
  .btn:active { transform: scale(.98); }
  .btn.primario { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
  .btn.primario:hover { filter: brightness(1.06); color: var(--wine-ink); }
  .btn.ancho { width: 100%; }
  .btn.peligro { color: #B42318; border-color: color-mix(in srgb, #B42318 35%, var(--line)); }
  :root[data-theme="dark"] .btn.peligro { color: #F59A8F; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; }
  .fila > .btn { flex: 1 1 180px; }

  /* Formularios */
  label.campo { display: grid; gap: 6px; font: 600 .88rem/1.3 var(--sans); }
  input[type="text"], input[type="number"], input[type="datetime-local"], textarea {
    width: 100%; min-height: 46px; padding: 11px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--paper);
    font: 400 1rem/1.5 var(--serif); color: var(--ink);
    transition: border-color .2s;
  }
  input:focus, textarea:focus { border-color: var(--wine); outline: none; box-shadow: 0 0 0 3px var(--wine-soft); }
  textarea { resize: vertical; min-height: 110px; }
  .ayuda { font: 400 .82rem/1.45 var(--sans); color: var(--ink-2); }
  form.pila { display: grid; gap: 14px; }

  /* Progreso */
  .lectores { display: grid; gap: 16px; }
  .lector-fila { display: grid; gap: 8px; }
  .lector-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .lector-cab strong { font: 600 1.15rem/1.2 var(--display); }
  .cuentas { display: flex; gap: 4px; }
  .cuenta { flex: 1; height: 10px; border-radius: 99px; background: var(--line); position: relative; }
  .cuenta.leido { background: var(--c); }
  .cuenta.conversado::after { content: ''; position: absolute; inset: -3px; border-radius: 99px; border: 1.5px solid var(--c); }
  .yo { --c: var(--wine); }
  .el { --c: var(--amber); }

  /* Ahora toca */
  .toca { display: grid; gap: 4px; }
  .toca h3 { font-size: 1.5rem; }
  .toca-num { font: 600 .8rem/1 var(--sans); color: var(--wine); }

  /* Plan */
  .plan { display: grid; gap: 12px; }
  .enc, .cierre { scroll-margin-top: 72px; }
  label.btn:focus-within { outline: 3px solid var(--amber); outline-offset: 2px; }
  .enc { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .enc-cab {
    width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    padding: 16px; border: 0; background: transparent; text-align: left; cursor: pointer;
  }
  .num {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    font: 700 1.05rem/1 var(--display); border: 1.5px solid var(--line); color: var(--ink-2);
  }
  .enc.leido .num { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
  .enc.leido .num .ic { width: 18px; height: 18px; stroke-width: 2.4; }
  .enc-tit { display: grid; gap: 2px; min-width: 0; }
  .enc-tit strong { font: 600 1.22rem/1.2 var(--display); }
  .enc-der { display: flex; align-items: center; gap: 8px; }
  .marcas { display: flex; gap: 4px; }
  .marca-p {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font: 700 .7rem/1 var(--sans); border: 1.5px solid var(--c); color: var(--c); background: transparent;
  }
  .marca-p.on { background: var(--c); color: var(--card); }
  .chev { color: var(--ink-2); transition: transform .25s; }
  .enc-cab[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .enc-cuerpo { padding: 0 18px 20px; display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
  .enc-cuerpo h3 { font-size: 1.15rem; color: var(--wine); }
  .chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips li { font: 500 .82rem/1.2 var(--sans); padding: 7px 12px; border-radius: 99px; background: var(--amber-soft); color: var(--ink); }
  ol.preguntas { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; }
  ol.preguntas li::marker { font: 700 1rem var(--display); color: var(--wine); }
  .nota-cab { display: flex; justify-content: space-between; align-items: baseline; }
  .guardado { font: 400 .78rem/1 var(--sans); color: var(--ok); opacity: 0; transition: opacity .3s; }
  .guardado.si { opacity: 1; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 12px;
    border-radius: 14px; border: 1.5px dashed var(--line); background: transparent; cursor: pointer;
    font: 600 .9rem/1.2 var(--sans); color: var(--ink-2); transition: all .2s;
  }
  .toggle[aria-pressed="true"] { border-style: solid; border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .cierre { background: linear-gradient(160deg, var(--cover-1), var(--cover-2)); color: var(--cover-ink); border: 0; }
  .cierre h2, .cierre .eyebrow { color: var(--cover-ink); }
  .cierre ol.preguntas li::marker { color: #F2B36B; }

  /* Lector */
  .barra {
    position: sticky; top: calc(env(safe-area-inset-top) + 60px); z-index: 5;
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .barra .pag { display: flex; align-items: center; gap: 6px; font: 500 .9rem var(--sans); color: var(--ink-2); margin: 0 auto; }
  .barra .pag input { width: 64px; min-height: 40px; padding: 6px; text-align: center; font: 600 1rem var(--sans); }
  .barra .icon-btn[disabled] { opacity: .35; cursor: default; }
  .donde { text-align: center; }
  .hoja { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: auto; padding: 0; touch-action: pan-y pinch-zoom; min-height: 60vh; display: grid; place-items: start center; }
  .hoja.zoom { touch-action: auto; place-items: start start; }
  .hoja canvas { display: block; max-width: none; }
  .hoja.noche canvas { filter: invert(.9) hue-rotate(180deg); }
  .aviso { border-left: 4px solid var(--amber); }
  .segmentos.modo { grid-template-columns: 1fr 1fr; }
  .barra .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; flex: none; }
  .barra .icon-btn { width: 42px; flex: none; }
  .barra .icon-btn:disabled { opacity: .35; cursor: default; background: transparent; color: var(--ink-2); }
  .pag-actual { margin: 0 auto; padding: 0 4px; display: grid; justify-items: center; gap: 1px; font: 600 .9rem/1.15 var(--sans); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pag-actual small { font: 600 .66rem/1.1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--wine); }
  .aa { font-family: var(--display); font-weight: 700; line-height: 1; }
  .aa.chica { font-size: .95rem; }
  .aa.grande { font-size: 1.45rem; }
  .progreso { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progreso span { display: block; height: 100%; width: 0; background: var(--wine); transition: width .2s; }

  /* Modo texto: la letra se agranda y las líneas se acomodan al ancho */
  .t-cab { padding: 6px 2px 0; }
  .t-cab h1 { font-size: 2rem; margin-top: 4px; }
  .texto {
    font: 400 var(--letra, 19px)/1.75 var(--serif); color: var(--ink);
    max-width: 34em; width: 100%; margin: 0 auto; padding: 0 2px;
    hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
  }
  .texto p { margin: 0 0 1em; }
  .texto h2, .texto h3, .texto h4 { font-family: var(--display); color: var(--wine); line-height: 1.2; margin: 1.5em 0 .6em; hyphens: manual; }
  .texto h2 { font-size: 1.7em; text-align: center; }
  .texto h3 { font-size: 1.4em; }
  .texto h4 { font-size: 1.2em; }
  .texto > :first-child { margin-top: .4em; }
  .texto blockquote { margin: 0 0 1em; padding: .1em 0 .1em .9em; border-left: 3px solid var(--amber); font-style: italic; }
  .texto blockquote p { margin: 0 0 .5em; }
  .texto .t-firma { text-align: right; font: 600 .78em/1.4 var(--sans); letter-spacing: .12em; color: var(--ink-2); font-style: normal; }
  .texto .pg {
    display: inline-block; margin: 0 .3em; padding: .2em .55em; border-radius: 99px;
    border: 1px solid var(--line); background: var(--paper);
    font: 600 .5em/1.2 var(--sans); font-style: normal; color: var(--ink-2); vertical-align: .25em;
    -webkit-user-select: none; user-select: none;
  }
  .texto .pg::before { content: 'pág. '; }

  /* Cuaderno */
  .nota-texto { white-space: pre-wrap; }
  .pasos { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: p; }
  .pasos li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; counter-increment: p; }
  .pasos li::before { content: counter(p); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--wine-soft); color: var(--wine); font: 700 1rem/1 var(--display); }
  .pasos li::before { font-size: 1.15rem; }
  .pasos strong { display: block; font: 600 1.25rem/1.2 var(--display); margin-bottom: 2px; }
  .pasos .suave { font-size: .9rem; line-height: 1.55; }

  /* Ajustes */
  .segmentos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
  .segmentos button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font: 600 .88rem var(--sans); color: var(--ink-2); }
  .segmentos button[aria-pressed="true"] { background: var(--card); color: var(--wine); box-shadow: var(--shadow); }

  details.desplegar summary { cursor: pointer; font: 600 .92rem/1.3 var(--sans); color: var(--wine); min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; }
  details.desplegar summary::-webkit-details-marker { display: none; }
  details.desplegar[open] summary .chev { transform: rotate(180deg); }
  details.desplegar > div { display: grid; gap: 12px; margin-top: 6px; }

  /* Navegación inferior */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: center;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 680px; }
  .tabs a {
    display: grid; justify-items: center; align-content: center; gap: 3px; height: var(--nav-h);
    text-decoration: none; color: var(--ink-2); font: 600 .72rem/1 var(--sans); letter-spacing: .02em;
    transition: color .2s;
  }
  .tabs a .ic { width: 22px; height: 22px; }
  .tabs a[aria-current="page"] { color: var(--wine); }
  .tabs a[aria-current="page"] .ic { stroke-width: 2.2; }

  /* Aviso flotante */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); z-index: 30;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 999px;
    font: 500 .9rem/1.3 var(--sans); max-width: calc(100% - 32px); text-align: center;
    transition: opacity .25s, transform .25s;
  }
  .toast.si { opacity: 1; transform: translate(-50%, 0); }

  .pie { text-align: center; padding: 8px 0 4px; }

  @media (min-width: 560px) {
    .portada { width: 112px; }
    .card { padding: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header class="top">

    <a href="#ajustes" class="icon-btn" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></a>
  </header>

  <main id="vista" tabindex="-1">
    <noscript><p class="card">Esta página necesita JavaScript para funcionar.</p></noscript>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <div class="tabs-in">
      <a href="#inicio" data-v="inicio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Inicio</a>
